name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SLANG_VERSION: 2026.20

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Platform boundary self-test
        run: python scripts/boundary_scan.py --self-test

      - name: Verify vendored dependency pins
        run: python scripts/check-vendor-pins.py

      - name: Platform boundary check
        run: python scripts/boundary_scan.py --fail

      - name: Install Zig from build.zig.zon
        uses: mlugg/setup-zig@v2

      - name: Install Slang on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) archive="slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz" ;;
            Linux-ARM64) archive="slang-${SLANG_VERSION}-linux-aarch64.tar.gz" ;;
            macOS-X64) archive="slang-${SLANG_VERSION}-macos-x86_64.zip" ;;
            macOS-ARM64) archive="slang-${SLANG_VERSION}-macos-aarch64.zip" ;;
            *) echo "Unsupported Slang runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac

          url="https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/${archive}"
          install_dir="${RUNNER_TEMP}/slang"
          mkdir -p "$install_dir"
          if [[ "$archive" == *.zip ]]; then
            curl --fail --location --retry 3 "$url" -o "${RUNNER_TEMP}/${archive}"
            unzip -q "${RUNNER_TEMP}/${archive}" -d "$install_dir"
          else
            curl --fail --location --retry 3 "$url" -o "${RUNNER_TEMP}/${archive}"
            tar -xzf "${RUNNER_TEMP}/${archive}" -C "$install_dir"
          fi

          slang_bin="$(find "$install_dir" -type f -name slangc -print -quit)"
          if [[ -z "$slang_bin" ]]; then
            echo "slangc was not found in ${archive}" >&2
            exit 1
          fi
          chmod +x "$slang_bin"
          dirname "$slang_bin" >> "$GITHUB_PATH"
          "$slang_bin" -version

      - name: Install Slang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "slang-$env:SLANG_VERSION-windows-x86_64.zip"
          $url = "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/$archive"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP 'slang'
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $compiler = Get-ChildItem -LiteralPath $installDir -Recurse -Filter slangc.exe | Select-Object -First 1
          if ($null -eq $compiler) { throw "slangc.exe was not found in $archive" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $compiler.DirectoryName
          & $compiler.FullName -version

      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      # A dependency download can fail on a dropped connection, and that happens before any code is
      # compiled. Retry the fetch here, so a flaky download does not fail the job.
      - name: Fetch dependencies, retrying on network failures
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if zig build --fetch; then
              exit 0
            fi
            echo "Dependency fetch failed on attempt $attempt; retrying."
            sleep $((attempt * 15))
          done
          echo "Dependency fetch failed after 4 attempts." >&2
          exit 1

      - name: Build development profile
        run: zig build

      - name: Build debug profile
        run: zig build -Dprofile=debug

      - name: Build release profile
        run: zig build -Dprofile=release

      - name: Check asset manifests and the installed atlas index
        run: zig build check-assets

      - name: Build and launch the asset keyer CLI
        run: zig build asset-keyer -- --help

      - name: Build and launch the asset importer CLI
        run: zig build asset-import -- --help

      - name: Build Metal shaders on macOS
        if: runner.os == 'macOS'
        run: zig build -Dmetal=true

      - name: Run unit and UI tests
        run: zig build test
