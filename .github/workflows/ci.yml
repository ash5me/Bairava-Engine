name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SLANG_VERSION: "2026.20"
  DXC_VERSION: "1.8.2505.1"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record font fingerprint
        shell: bash
        run: |
          python -c "import hashlib; d = open('assets/font.ttf', 'rb').read(); print('assets/font.ttf bytes=%d sha256=%s' % (len(d), hashlib.sha256(d).hexdigest()))"
          git ls-files --eol assets/font.ttf

      - name: Platform boundary self-test
        run: python scripts/boundary_scan.py --self-test

      - name: Verify vendored dependency pins
        run: python scripts/check-dependency-pins.py

      - name: Platform boundary check
        run: python scripts/boundary_scan.py --fail

      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0-dev.3142+5ccfeb926

      - name: Install Slang on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) archive="slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz" ;;
            Linux-ARM64) archive="slang-${SLANG_VERSION}-linux-aarch64.tar.gz" ;;
            macOS-X64) archive="slang-${SLANG_VERSION}-macos-x86_64.zip" ;;
            macOS-ARM64) archive="slang-${SLANG_VERSION}-macos-aarch64.zip" ;;
            *) echo "Unsupported Slang runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac

          url="https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/${archive}"
          install_dir="${RUNNER_TEMP}/slang"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 "$url" -o "${RUNNER_TEMP}/${archive}"
          python scripts/check-dependency-pins.py --slang-archive "${RUNNER_TEMP}/${archive}"
          if [[ "$archive" == *.zip ]]; then
            unzip -q "${RUNNER_TEMP}/${archive}" -d "$install_dir"
          else
            tar -xzf "${RUNNER_TEMP}/${archive}" -C "$install_dir"
          fi

          slang_bin="$(find "$install_dir" -type f -name slangc -print -quit)"
          if [[ -z "$slang_bin" ]]; then
            echo "slangc was not found in ${archive}" >&2
            exit 1
          fi
          chmod +x "$slang_bin"
          python scripts/check-dependency-pins.py --slang-compiler "$slang_bin"
          dirname "$slang_bin" >> "$GITHUB_PATH"
          "$slang_bin" -version

      - name: Install Slang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "slang-$env:SLANG_VERSION-windows-x86_64.zip"
          $url = "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/$archive"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP 'slang'
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          python scripts/check-dependency-pins.py --slang-archive $archivePath
          if ($LASTEXITCODE -ne 0) { throw "Slang archive checksum did not match dependency-lock.json" }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $compiler = Get-ChildItem -LiteralPath $installDir -Recurse -Filter slangc.exe | Select-Object -First 1
          if ($null -eq $compiler) { throw "slangc.exe was not found in $archive" }
          python scripts/check-dependency-pins.py --slang-compiler $compiler.FullName
          if ($LASTEXITCODE -ne 0) { throw "Slang compiler version did not match dependency-lock.json" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $compiler.DirectoryName
          & $compiler.FullName -version

      - name: Install DXC runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dxc_2025_07_14.zip"
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v$env:DXC_VERSION/$archive"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          python scripts/check-dependency-pins.py --dxc-archive $archivePath
          if ($LASTEXITCODE -ne 0) { throw "DXC archive checksum did not match dependency-lock.json" }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
          $runtimeDir = Join-Path $installDir 'bin\x64'
          foreach ($runtime in @('dxcompiler.dll', 'dxil.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtimeDir $runtime))) {
              throw "DXC runtime file $runtime was not found in $archive"
            }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $runtimeDir

      - name: Cache Zig packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}

      # A dependency download can fail on a dropped connection, and that happens before any code is
      # compiled. Retry the fetch here, so a flaky download does not fail the job.
      - name: Fetch dependencies, retrying on network failures
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if zig build --fetch; then
              exit 0
            fi
            echo "Dependency fetch failed on attempt $attempt; retrying."
            sleep $((attempt * 15))
          done
          echo "Dependency fetch failed after 4 attempts." >&2
          exit 1

      - name: Build development profile
        run: zig build

      - name: Generate documentation
        if: runner.os == 'Linux'
        run: zig build docs

      - name: Render documentation site
        if: runner.os == 'Linux'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./zig-out/doc/bairava
          destination: ./_site

      - name: Validate rendered documentation
        if: runner.os == 'Linux'
        run: python scripts/docs/build_site.py --check-rendered _site

      - name: Upload validated documentation source
        if: runner.os == 'Linux' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site-source
          path: ./zig-out/doc/bairava
          retention-days: 1

      - name: Build debug profile
        run: zig build -Dprofile=debug

      - name: Build release profile
        run: zig build -Dprofile=release

      - name: Check asset manifests and the installed atlas index
        run: zig build check-assets

      - name: Build and launch the asset keyer CLI
        run: zig build asset-keyer -- --help

      - name: Build and launch the asset importer CLI
        run: zig build asset-import -- --help

      - name: Build Metal shaders on macOS
        if: runner.os == 'macOS'
        run: zig build -Dmetal=true

      - name: Build DXIL shaders on Windows
        if: runner.os == 'Windows'
        run: zig build -Ddxil=true

      - name: Run engine tests
        run: zig build test

      - name: Run UI tests directly
        run: zig build test-ui

  publish-docs:
    name: Publish documentation
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download validated documentation source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site-source
          path: ./zig-out/doc/bairava

      - name: Fetch published documentation archive
        shell: bash
        run: |
          mkdir -p _docs_archive
          if git ls-remote --exit-code origin refs/heads/docs-archive >/dev/null; then
            git fetch --no-tags origin refs/heads/docs-archive
            git archive FETCH_HEAD | tar -x -C _docs_archive
          fi

      - name: Prepare versioned documentation
        id: docs
        run: >-
          python scripts/docs/prepare_publication.py
          --source zig-out/doc/bairava
          --archive _docs_archive
          --sources _docs_to_publish
          --site-root _publish
          --ref-type "${{ github.ref_type }}"
          --ref-name "${{ github.ref_name }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Render development documentation
        if: steps.docs.outputs.build_dev == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_docs_to_publish/dev
          destination: ./_publish/dev

      - name: Render release documentation
        if: steps.docs.outputs.build_release == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_docs_to_publish/release
          destination: ./_publish/${{ steps.docs.outputs.engine_version }}

      - name: Render latest release documentation
        if: steps.docs.outputs.build_latest == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./_docs_to_publish/latest
          destination: ./_publish/latest

      - name: Validate versioned documentation
        run: python scripts/docs/build_site.py --check-publication _publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./_publish

      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Persist versioned site archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh auth setup-git
          mkdir docs-archive
          git -C docs-archive init --initial-branch=docs-archive
          git -C docs-archive config user.name "github-actions[bot]"
          git -C docs-archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C docs-archive remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code origin refs/heads/docs-archive >/dev/null; then
            git -C docs-archive fetch --depth=1 origin docs-archive
            git -C docs-archive checkout -B docs-archive FETCH_HEAD
          fi
          cp -a _publish/. docs-archive/
          git -C docs-archive add -A
          if ! git -C docs-archive diff --cached --quiet; then
            git -C docs-archive commit \
              -m "Update published documentation archive" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git -C docs-archive push origin docs-archive
          fi
